timing: 2026-08-12, after the latest Email revision assessment
reproducibility: Observed once in normal learner testing; broader reproduction has
  not yet been confirmed.
impact: The learner receives duplicate, lower-value advice and cannot rely on the
  follow-up to identify the refinements needed to move a stable score-4 response toward
  score 5.
expected: The follow-up should appear after the revision assessment and use only previously
  unaddressed excerpts or issues. It should not repeat the committee-name advice already
  given in the scored assessment, and it should offer a precise next-step improvement
  toward score 5.
observed: For revision W-EM-20260811-001-R3, the requested follow-up repeated `a member
  of the campus and library committee`, although that exact issue was already listed
  in the scored Evidence section. The follow-up therefore did not provide a new, high-value
  improvement toward score 5.
steps:
- Submit the original Writing Email about library construction noise.
- Submit revisions through W-EM-20260811-001-R3 and receive its scored assessment.
- Request the naturalness and precision follow-up for the latest revision.
- Compare the follow-up excerpt with the revision feedback Evidence section.
