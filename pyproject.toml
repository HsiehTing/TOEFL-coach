[project]
name = "toefl-coaching-tracker"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0,<7"]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[tool.pytest.ini_options]
pythonpath = ["tools"]
testpaths = ["tests"]
addopts = "-ra"

[tool.toefl_tracker]
audio_quality_policy = "standards/ets-2026/audio-quality-policy.yaml"
